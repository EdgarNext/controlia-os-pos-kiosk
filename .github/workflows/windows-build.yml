name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build Windows installer
        run: npm run make -- --platform=win32 --arch=x64

      - name: Show generated files
        shell: pwsh
        run: |
          if (Test-Path out) {
            Get-ChildItem -Recurse out | Select-Object FullName,Length,LastWriteTime
          } else {
            Write-Error "No se generó carpeta out"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: controlia-pos-kiosk-windows
          path: |
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES
            out/**/*.exe